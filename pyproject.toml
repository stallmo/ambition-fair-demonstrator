[project]
name = "ambition-fair-demonstrator"
version = "0.1.0"
description = "Interactive predictive maintenance demonstrator for fair presentations"
requires-python = ">=3.9"
dependencies = [
    "PyQt5>=5.15.0",
    "matplotlib>=3.5.0",
    "scikit-learn>=1.0.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "ui", "utils"]
